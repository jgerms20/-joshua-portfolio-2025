name: Auto-Merge Claude Branch PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  auto-merge:
    name: Auto-merge if from claude/ branch
    runs-on: ubuntu-latest
    # Only run if the PR branch starts with claude/
    if: startsWith(github.head_ref, 'claude/')
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Auto-merging PR #${{ github.event.pull_request.number }} from branch ${{ github.head_ref }}"
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --auto \
            --subject "Auto-merge: ${{ github.event.pull_request.title }}" \
            --body "Auto-merged from branch \`${{ github.head_ref }}\` by the auto-merge workflow."

      - name: Post merge comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "✅ **Auto-merge enabled** — this PR will merge automatically once checks pass. No action needed."
        continue-on-error: true
