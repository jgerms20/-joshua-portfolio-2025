name: Twice-Weekly Portfolio Update

on:
  schedule:
    # Every Monday at 9:00am PT (17:00 UTC)
    - cron: '0 17 * * 1'
    # Every Friday at 9:00am PT (17:00 UTC)
    - cron: '0 17 * * 5'
  workflow_dispatch:
    # Allow manual trigger from the Actions tab in GitHub

jobs:
  update:
    name: Update AI Projects Section
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run portfolio update script
        run: python scripts/update-portfolio.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "Portfolio Bot"
          git config user.email "portfolio-bot@jgerms20.github.io"
          WEEK=$(date +%Y-W%V)
          if git diff --quiet; then
            echo "No changes to commit this week."
          else
            git add index.html portfolio-memory.json
            git commit -m "Portfolio update - ${WEEK} ($(date +%A))"
            git push
            echo "Pushed weekly update for ${WEEK}"
          fi

      - name: Generate weekly summary report
        run: python scripts/weekly-summary.py >> $GITHUB_STEP_SUMMARY
